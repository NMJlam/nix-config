# Public age keys that can decrypt the secrets. Private keys never enter the repo.
# After changing the keys, re-encrypt with `sops updatekeys machines/homelab/secrets.yaml`.
keys:
  # ~/Library/Application Support/sops/age/keys.txt on the MacBook. Back it up outside the repo.
  - &nlam age1rldnah2matrj0e4uv7sf4jpdsxkjw0pe89ljw3u7t5jdgrrd6dgsxvgm7u
  - &homelab age1cht7sthsmdsmf0hvggsj3egxnqmhzewrqzdf806pglg5cg8ya3ysk4l2rr
creation_rules:
  - path_regex: machines/homelab/secrets\.yaml$
    key_groups:
      - age:
          - *nlam
          - *homelab
